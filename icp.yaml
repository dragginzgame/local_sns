# yaml-language-server: $schema=https://raw.githubusercontent.com/dfinity/icp-cli/main/docs/schemas/icp-yaml-schema.json

canisters: []

networks:
  - name: local
    mode: managed
    nns: true
    gateway:
      bind: 127.0.0.1
      port: 8000
    subnets:
      - application

environments:
  - name: local
    network: local
    canisters: []
